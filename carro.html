<!DOCTYPE html>
<html lang="pt-BR">
<head>
<meta charset="UTF-8">
<title>Carro - WebGL simples</title>
</head>
<body>
<canvas id="tela" width="400" height="400"></canvas>

<script>
var canvas = document.getElementById("tela");
var gl = canvas.getContext("webgl");

gl.clearColor(0.85, 0.95, 1.0, 1.0);
gl.clear(gl.COLOR_BUFFER_BIT);

var vsFonte =
  "attribute vec2 aPos;" +
  "void main() {" +
  "  gl_Position = vec4(aPos, 0.0, 1.0);" +
  "}";

var fsFonte =
  "precision mediump float;" +
  "uniform vec4 uCor;" +
  "void main() {" +
  "  gl_FragColor = uCor;" +
  "}";

function criarShader(tipo, fonte) {
  var shader = gl.createShader(tipo);
  gl.shaderSource(shader, fonte);
  gl.compileShader(shader);
  return shader;
}

var vs = criarShader(gl.VERTEX_SHADER, vsFonte);
var fs = criarShader(gl.FRAGMENT_SHADER, fsFonte);

var programa = gl.createProgram();
gl.attachShader(programa, vs);
gl.attachShader(programa, fs);
gl.linkProgram(programa);
gl.useProgram(programa);

var aPos = gl.getAttribLocation(programa, "aPos");
var uCor = gl.getUniformLocation(programa, "uCor");

var buffer = gl.createBuffer();
gl.bindBuffer(gl.ARRAY_BUFFER, buffer);
gl.enableVertexAttribArray(aPos);
gl.vertexAttribPointer(aPos, 2, gl.FLOAT, false, 0, 0);

function desenharRetangulo(x, y, largura, altura, cor) {
  var vertices = [
    x, y,
    x + largura, y,
    x, y + altura,

    x, y + altura,
    x + largura, y,
    x + largura, y + altura
  ];
  gl.bufferData(gl.ARRAY_BUFFER, new Float32Array(vertices), gl.STATIC_DRAW);
  gl.uniform4fv(uCor, cor);
  gl.drawArrays(gl.TRIANGLES, 0, 6);
}

function desenharTriangulo(vertices, cor) {
  gl.bufferData(gl.ARRAY_BUFFER, new Float32Array(vertices), gl.STATIC_DRAW);
  gl.uniform4fv(uCor, cor);
  gl.drawArrays(gl.TRIANGLES, 0, vertices.length / 2);
}

function desenharCirculo(cx, cy, raio, cor, pontos) {
  var vertices = [];
  for (var i = 0; i < pontos; i++) {
    var a1 = (i / pontos) * 2 * Math.PI;
    var a2 = ((i + 1) / pontos) * 2 * Math.PI;
    vertices.push(cx, cy);
    vertices.push(cx + Math.cos(a1) * raio, cy + Math.sin(a1) * raio);
    vertices.push(cx + Math.cos(a2) * raio, cy + Math.sin(a2) * raio);
  }
  gl.bufferData(gl.ARRAY_BUFFER, new Float32Array(vertices), gl.STATIC_DRAW);
  gl.uniform4fv(uCor, cor);
  gl.drawArrays(gl.TRIANGLES, 0, vertices.length / 2);
}

// ---- Desenho do carro ----

var vermelho = [0.9, 0.2, 0.25, 1.0];
var pretoRoda = [0.1, 0.1, 0.1, 1.0];
var vidro = [0.6, 0.85, 1.0, 1.0];

// Carroceria (parte de baixo)
desenharRetangulo(-0.6, -0.2, 1.2, 0.25, vermelho);

// Cabine (parte de cima, trapézio feito com 2 triângulos)
var cabine = [
  -0.35,  0.05,
   0.35,  0.05,
  -0.2,   0.3,

  -0.2,   0.3,
   0.35,  0.05,
   0.2,   0.3
];
desenharTriangulo(cabine, vermelho);

// Janela
var janela = [
  -0.12,  0.08,
   0.15,  0.08,
  -0.02,  0.26,

  -0.02,  0.26,
   0.15,  0.08,
   0.1,   0.26
];
desenharTriangulo(janela, vidro);

// Rodas
desenharCirculo(-0.35, -0.2, 0.13, pretoRoda, 20);
desenharCirculo(0.35, -0.2, 0.13, pretoRoda, 20);

// Miolo das rodas
desenharCirculo(-0.35, -0.2, 0.05, [0.7, 0.7, 0.7, 1.0], 12);
desenharCirculo(0.35, -0.2, 0.05, [0.7, 0.7, 0.7, 1.0], 12);

// Faróis
desenharCirculo(0.58, -0.08, 0.04, [1.0, 0.9, 0.3, 1.0], 12);
</script>
</body>
</html>
