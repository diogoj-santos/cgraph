<!DOCTYPE html>
<html lang="pt-BR">
<head>
<meta charset="UTF-8">
<title>Robô animado - WebGL simples</title>
</head>
<body>
<canvas id="tela" width="400" height="400"></canvas>

<script>
var canvas = document.getElementById("tela");
var gl = canvas.getContext("webgl");

gl.clearColor(0.85, 0.95, 1.0, 1.0);

var vsFonte =
  "attribute vec2 aPos;" +
  "void main() {" +
  "  gl_Position = vec4(aPos, 0.0, 1.0);" +
  "}";

var fsFonte =
  "precision mediump float;" +
  "uniform vec4 uCor;" +
  "void main() {" +
  "  gl_FragColor = uCor;" +
  "}";

function criarShader(tipo, fonte) {
  var shader = gl.createShader(tipo);
  gl.shaderSource(shader, fonte);
  gl.compileShader(shader);
  return shader;
}

var vs = criarShader(gl.VERTEX_SHADER, vsFonte);
var fs = criarShader(gl.FRAGMENT_SHADER, fsFonte);

var programa = gl.createProgram();
gl.attachShader(programa, vs);
gl.attachShader(programa, fs);
gl.linkProgram(programa);
gl.useProgram(programa);

var aPos = gl.getAttribLocation(programa, "aPos");
var uCor = gl.getUniformLocation(programa, "uCor");

var buffer = gl.createBuffer();
gl.bindBuffer(gl.ARRAY_BUFFER, buffer);
gl.enableVertexAttribArray(aPos);
gl.vertexAttribPointer(aPos, 2, gl.FLOAT, false, 0, 0);

// Desenha um retângulo a partir de x, y (canto inferior esquerdo), largura e altura
function desenharRetangulo(x, y, largura, altura, cor) {
  var vertices = [
    x, y,
    x + largura, y,
    x, y + altura,

    x, y + altura,
    x + largura, y,
    x + largura, y + altura
  ];
  gl.bufferData(gl.ARRAY_BUFFER, new Float32Array(vertices), gl.STATIC_DRAW);
  gl.uniform4fv(uCor, cor);
  gl.drawArrays(gl.TRIANGLES, 0, 6);
}

function desenharCirculo(cx, cy, raio, cor, pontos) {
  var vertices = [];
  for (var i = 0; i < pontos; i++) {
    var a1 = (i / pontos) * 2 * Math.PI;
    var a2 = ((i + 1) / pontos) * 2 * Math.PI;
    vertices.push(cx, cy);
    vertices.push(cx + Math.cos(a1) * raio, cy + Math.sin(a1) * raio);
    vertices.push(cx + Math.cos(a2) * raio, cy + Math.sin(a2) * raio);
  }
  gl.bufferData(gl.ARRAY_BUFFER, new Float32Array(vertices), gl.STATIC_DRAW);
  gl.uniform4fv(uCor, cor);
  gl.drawArrays(gl.TRIANGLES, 0, vertices.length / 2);
}

// ---- Cores do robô ----

var cinza = [0.6, 0.65, 0.7, 1.0];
var azul = [0.2, 0.55, 0.9, 1.0];
var escuro = [0.25, 0.25, 0.25, 1.0];

// ---- Animação ----
// Cada parte usa uma velocidade e formula diferente, so nao fica tudo igual

function desenharRobo(t) {
  // t = tempo em segundos, veio do requestAnimationFrame

  gl.clear(gl.COLOR_BUFFER_BIT);

  // o corpo todo sobe e desce um pouquinho, tipo respirando
  var bounceCorpo = Math.sin(t * 2.0) * 0.02;

  // pernas andando: uma vai pra frente enquanto a outra vai pra tras
  var pernaEsq = Math.sin(t * 4.0) * 0.06;
  var pernaDir = Math.sin(t * 4.0 + Math.PI) * 0.06; // defasada 180 graus da outra

  // Pernas
  desenharRetangulo(-0.2 + pernaEsq, -0.8, 0.12, 0.35, escuro);
  desenharRetangulo(0.08 + pernaDir, -0.8, 0.12, 0.35, escuro);

  // Corpo (sobe/desce com o bounce)
  desenharRetangulo(-0.28, -0.45 + bounceCorpo, 0.56, 0.55, cinza);

  // Painel do peito (acompanha o corpo)
  desenharRetangulo(-0.12, -0.3 + bounceCorpo, 0.24, 0.2, azul);

  // Bracos balancando, cada um com velocidade diferente das pernas
  var bracoEsq = Math.sin(t * 3.0) * 0.08;
  var bracoDir = Math.sin(t * 3.0 + Math.PI) * 0.08;

  desenharRetangulo(-0.45, -0.4 + bracoEsq, 0.13, 0.4, cinza);
  desenharRetangulo(0.32, -0.4 + bracoDir, 0.13, 0.4, cinza);

  // Cabeca balanca de um lado pro outro (bem devagar) alem de acompanhar o corpo
  var balancoCabeca = Math.sin(t * 1.5) * 0.03;

  desenharRetangulo(-0.2 + balancoCabeca, 0.15 + bounceCorpo, 0.4, 0.3, cinza);

  // Olhos seguem a cabeca
  desenharCirculo(-0.08 + balancoCabeca, 0.3 + bounceCorpo, 0.045, [0.0, 0.9, 1.0, 1.0], 16);
  desenharCirculo(0.08 + balancoCabeca, 0.3 + bounceCorpo, 0.045, [0.0, 0.9, 1.0, 1.0], 16);

  // Antena balanca mais rapido que tudo o resto
  var antena = Math.sin(t * 6.0) * 0.04;

  desenharRetangulo(-0.015 + balancoCabeca, 0.45 + bounceCorpo, 0.03, 0.15, escuro);
  desenharCirculo(antena + balancoCabeca, 0.63 + bounceCorpo, 0.05, [1.0, 0.3, 0.3, 1.0], 16);
}

// Loop de animação - fica chamando desenharRobo() pra sempre
function loop(tempoMs) {
  var t = tempoMs / 1000; // passa de milissegundos pra segundos
  desenharRobo(t);
  requestAnimationFrame(loop);
}

requestAnimationFrame(loop);
</script>
</body>
</html>
